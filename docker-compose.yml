services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tutorconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutorconnect
      POSTGRES_PASSWORD: tutorconnect
      POSTGRES_DB: tutorconnect
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tutorconnect -d tutorconnect']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local DX: Redis published on 6379 without AUTH.
  # Staging/prod: remove ports mapping; use Docker network only; enable requirepass:
  #   command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
  #   healthcheck: redis-cli -a $$REDIS_PASSWORD ping
  #   REDIS_URL=redis://:PASSWORD@redis:6379
  redis:
    image: redis:7-alpine
    container_name: tutorconnect-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
